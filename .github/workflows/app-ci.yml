name: app-ci

on:
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/app-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/app-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the Contoso Ticketing app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/ContosoTicketing/ContosoTicketing.csproj --configuration Release

  # Expert Lab 5 adds CodeQL (`csharp` and `actions`) to this workflow and fails the
  # job on findings with security-severity >= 7.0. See docs/expert/lab-05-ghas.md.
