# Purpose: active repository automation. Dependabot keeps NuGet and GitHub Actions dependencies
# current for the hackathon; participant-safe examples live under docs/tracks/examples/.

version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/ContosoTicketing
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
